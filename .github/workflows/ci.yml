name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 src api tests scripts

      - name: Download and clean data
        run: python scripts/download_data.py

      - name: Train model
        run: python -m src.train

      - name: Unit tests
        run: pytest -v --junitxml=reports/junit.xml

      - name: Build Docker image and smoke test
        run: |
          docker build -t heart-api:ci .
          docker run -d --name api -p 8000:8000 heart-api:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}'
          docker logs api

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            models/
            reports/
            mlflow.db
            mlartifacts/
